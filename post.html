<body>

<div class="grain" aria-hidden="true"></div>

<nav>

<main>
  <a href="blog.html" class="back">← all posts</a>
  <h1 id="postTitle">Loading…</h1>
  <div class="meta" id="postMeta"></div>
  <div class="prose" id="postBody"></div>
</main>

<footer>
  <span>© 2026 Aniruddha Mandal · Bengaluru, IN</span>
  <span><a href="blog.html">← the backward pass</a></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@18.0.13/lib/marked.umd.js"
        integrity="sha384-Jy8qDMspJASzATgFngF2ompIKy0StbCcvuTE65mxDm/E0/YSIF6Ndc+5V7bbwRcw"
        crossorigin="anonymous"></script>
<script>
const mbar=document.getElementById('mbar'),de=document.documentElement;
addEventListener('scroll',()=>{mbar.style.transform=`scaleX(${de.scrollTop/((de.scrollHeight-innerHeight)||1)})`},{passive:true});
const slug=new URLSearchParams(location.search).get('p')||'';
const title=document.getElementById('postTitle');
const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});

(async()=>{
  const posts=await (await fetch('posts.json')).json();
  const post=posts.find(p=>p.slug===slug);
  if(!post){title.textContent='Post not found';return}

  const md=await fetch(`blog/${post.slug}.md`);
  if(!md.ok){title.textContent='Post not found';return}

  document.title=`${post.title} — Aniruddha Mandal`;
  title.textContent=post.title;
  document.getElementById('postMeta').innerHTML=
    `<time datetime="${post.date}">${fmt(post.date)}</time>`+
    (post.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('');
  document.getElementById('postBody').innerHTML=marked.parse(await md.text());

  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    try{
      const {animate,stagger}=await import('https://cdn.jsdelivr.net/npm/animejs@4/+esm');
      animate('#postTitle, .meta, .prose',{opacity:[0,1],translateY:[18,0],delay:stagger(90),duration:600,ease:'outCubic'});
    }catch(e){}
  }
})().catch(()=>{title.textContent='Could not load this post'});
</script>
</body>
</html>
